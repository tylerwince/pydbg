name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Install the built wheel and test dependencies
        run: |
          for wheel in dist/*.whl; do
            python -m pip install --upgrade "${wheel}[test]"
          done
      - name: Verify the installed package
        run: |
          python -I - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          import pydbg

          installed = distribution("pydbg")
          module_path = Path(pydbg.__file__).resolve()
          assert module_path == installed.locate_file("pydbg.py").resolve(), module_path
          assert pydbg.__version__ == installed.version
          print(f"Testing pydbg {installed.version} from {module_path}")
          PY
      - name: Run tests against the installed wheel
        run: python -I -m pytest --import-mode=importlib
